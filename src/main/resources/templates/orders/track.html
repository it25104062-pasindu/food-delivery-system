<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Track Order')}"></head>
<body style="background:#0f0f0f;">
<div th:replace="~{layout/nav-customer :: nav}"></div>

<main class="max-w-3xl mx-auto px-4 py-10 fade-in">
    <a href="/customer/orders/history" style="color:#9ca3af; font-size:13px; text-decoration:none; margin-bottom:20px; display:inline-block;">← Back to Orders</a>
    <h1 style="font-family:'Playfair Display',serif; font-size:32px; color:#f5f5f5; margin-bottom:28px;">Track Order</h1>

    <div class="card p-6 mb-6">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div>
                <p style="font-size:12px; color:#6b7280;">Order ID</p>
                <p style="font-family:monospace; font-size:13px; color:#9ca3af;" th:text="${order.id}">id</p>
            </div>
            <span class="badge" th:classappend="${'badge-' + order.status}" th:text="${order.status}">STATUS</span>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:flex-start; position:relative; margin-bottom:32px; padding:0 2px;">
            <div style="position:absolute; left:calc(10% + 8px); right:calc(10% + 8px); top:19px; height:2px; background:#2e2e2e; z-index:0;"></div>
            <div th:each="step : ${ {'PENDING','CONFIRMED','PREPARING','OUT_FOR_DELIVERY','DELIVERED'} }"
                 style="z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; max-width:20%;">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-xs font-bold border-2"
                     th:styleappend="${(order.status == step or #strings.equals(order.status,step)) ?
                        'border-color:#ea6c0a;background-color:#f97316;color:#fff;box-shadow:0 0 0 6px rgba(249,115,22,.28);' :
                        'border-color:#52525b;background-color:#171717;color:#71717a;'}"
                     th:text="${step == 'PENDING' ? '1' : step == 'CONFIRMED' ? '2' : step == 'PREPARING' ? '3' : step == 'OUT_FOR_DELIVERY' ? '4' : '5'}">1</div>
                <p style="font-size:9px; color:#9ca3af; text-align:center; line-height:1.25;"
                   th:classappend="${(order.status == step or #strings.equals(order.status,step)) ? ' font-semibold text-orange-400' : ''}"
                   th:text="${#strings.replace(step,'_',' ')}">Step</p>
            </div>
        </div>

        <!-- Delivery address -->
        <div style="background:#151515; border-radius:8px; padding:14px;">
            <p style="font-size:12px; color:#6b7280; margin-bottom:4px;">Delivering to</p>
            <p style="font-size:14px; color:#d1d5db;" th:text="${order.deliveryAddress}">Address</p>
        </div>
    </div>

    <div class="card p-4">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
            <p style="font-size:13px; color:#9ca3af; font-weight:500; margin:0;">📍 Map view</p>
            <span th:if="${delivery != null}" class="badge" th:classappend="${'badge-' + delivery.status}"
                  th:text="${delivery.status}">ASSIGNED</span>
            <span th:if="${delivery == null}" style="font-size:12px; color:#6b7280;">Rider not assigned yet — Colombo area preview</span>
        </div>
        <div id="track-map" style="height:280px; border-radius:8px; overflow:hidden; position:relative;"
             th:attr="data-rider-name=${delivery != null ? delivery.riderName : ''}, data-has-delivery=${mapHasDelivery},
                       data-lat=${mapLatUs}, data-lng=${mapLngUs}"></div>
        <div th:if="${delivery != null}" style="display:flex; gap:16px; margin-top:12px; flex-wrap:wrap;">
            <p style="font-size:12px; color:#9ca3af;">Lat: <span style="color:#d1d5db;" th:text="${#numbers.formatDecimal(delivery.latitude,1,4)}">6.9271</span></p>
            <p style="font-size:12px; color:#9ca3af;">Lng: <span style="color:#d1d5db;" th:text="${#numbers.formatDecimal(delivery.longitude,1,4)}">79.8612</span></p>
            <p style="font-size:12px; color:#9ca3af;">Updated: <span style="color:#d1d5db;" th:text="${#strings.abbreviate(delivery.updatedAt,19)}">—</span></p>
            <p th:if="${delivery.riderName != null}" style="font-size:12px; color:#9ca3af;">Rider: <span style="color:#d1d5db;" th:text="${delivery.riderName}">—</span></p>
        </div>
    </div>

</main>

<script th:src="@{/webjars/leaflet/1.9.4/dist/leaflet.js}" src="/webjars/leaflet/1.9.4/dist/leaflet.js"></script>
<script>
    (function () {
        function boot() {
            const el = document.getElementById('track-map');
            if (!window.L || !el) return;

            const hasDelivery = el.dataset.hasDelivery === 'true';
            const lat = parseFloat(el.dataset.lat || '');
            const lng = parseFloat(el.dataset.lng || '');
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

            const riderName = el.dataset.riderName ? String(el.dataset.riderName).trim() : '';
            const map = L.map('track-map', { zoomControl: true }).setView([lat, lng], hasDelivery ? 15 : 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);

            const pinIcon = L.divIcon({
                html: '<div style="width:14px;height:14px;background:#f97316;border:2px solid #fff;border-radius:999px;box-shadow:0 0 0 8px rgba(249,115,22,.22);"></div>',
                className: '',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
            const marker = L.marker([lat, lng], { icon: pinIcon }).addTo(map);
            marker.bindPopup(hasDelivery && riderName
                ? '🛵 ' + riderName + ' — last GPS position'
                : hasDelivery ? '🛵 Rider last GPS position'
                : '📍 Colombo preview — assign a rider to see live GPS.');
            marker.openPopup();

            if (hasDelivery) {
                L.circle([lat, lng], {
                    radius: 90,
                    color: '#fb923c',
                    fillColor: '#f97316',
                    fillOpacity: 0.12,
                    weight: 1
                }).addTo(map);
            }

            requestAnimationFrame(function () {
                map.invalidateSize();
            });
        }

        if (document.readyState === 'complete') {
            boot();
        } else {
            window.addEventListener('load', boot);
        }
    })();
</script>
</body>
</html>
