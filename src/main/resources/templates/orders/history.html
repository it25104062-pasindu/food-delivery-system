<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Order History')}"></head>
<body style="background:#0f0f0f;">
<div th:replace="~{layout/nav-customer :: nav}"></div>

<main class="max-w-5xl mx-auto px-4 py-10 fade-in">
    <h1 style="font-family:'Playfair Display',serif; font-size:32px; color:#f5f5f5; margin-bottom:28px;">My Orders</h1>

    <div th:if="${#lists.isEmpty(orders)}" class="text-center py-20">
        <p style="font-size:48px; margin-bottom:12px;">📭</p>
        <p style="color:#6b7280;">You haven't placed any orders yet.</p>
        <a href="/customer/menu" class="btn-primary" style="display:inline-block; margin-top:16px;">Order Now</a>
    </div>

    <div th:each="order : ${orders}" class="card mb-4 overflow-hidden">
        <div style="padding:16px 20px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
            <div>
                <p style="font-size:13px; color:#6b7280; margin-bottom:4px;">Order ID</p>
                <p style="font-family:monospace; font-size:13px; color:#9ca3af;" th:text="${#strings.abbreviate(order.id, 18)}">id</p>
            </div>
            <div style="text-align:right;">
                <span class="badge" th:classappend="${'badge-' + order.status}" th:text="${order.status}">STATUS</span>
                <p style="font-size:20px; font-weight:700; color:#f97316; margin-top:6px;" th:text="${'Rs. ' + #numbers.formatDecimal(order.totalAmount,1,2)}">Rs. 0</p>
            </div>
        </div>

        <!-- Items summary -->
        <div style="padding:0 20px 12px; border-top:1px solid #1f1f1f; padding-top:12px;">
            <p style="font-size:12px; color:#6b7280; margin-bottom:6px;">Items</p>
            <p style="font-size:14px; color:#d1d5db;">
                <span th:each="oi,iter : ${order.items}" th:text="${oi.menuItemName + ' x' + oi.quantity + (iter.last ? '' : ', ')}">Item x1</span>
            </p>
        </div>

        <!-- Actions -->
        <div style="padding:12px 20px; border-top:1px solid #1f1f1f; display:flex; gap:8px; background:#151515;">
            <a th:href="@{/customer/orders/track/{id}(id=${order.id})}" class="btn-ghost" style="padding:6px 14px; font-size:13px;">Track Order</a>
            <form th:if="${order.status == 'PENDING'}" th:action="@{/customer/orders/cancel/{id}(id=${order.id})}" method="post" style="margin:0;">
                <button type="submit" class="btn-danger" style="padding:6px 14px; font-size:13px;"
                        onclick="return confirm('Cancel this order?')">Cancel</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
