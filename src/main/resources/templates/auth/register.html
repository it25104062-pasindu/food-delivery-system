<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Register')}"></head>
<body class="min-h-screen flex items-center justify-center py-12" style="background:#0f0f0f;">

<div class="w-full max-w-lg px-4 fade-in">
    <div class="text-center mb-8">
        <h1 style="font-family:'Playfair Display',serif; font-size:32px; color:#f97316; font-weight:700;">Create Account</h1>
        <p style="color:#6b7280; font-size:14px; margin-top:4px;">Join BiteBridge today</p>
    </div>

    <div class="card p-8">
        <form action="/register" method="post">
            <div class="grid grid-cols-1 gap-5">
                <div>
                    <label class="input-label">Full Name</label>
                    <input type="text" name="name" class="input-field" placeholder="Chamal Perera" required/>
                </div>
                <div>
                    <label class="input-label">Email Address</label>
                    <input type="email" name="email" class="input-field" placeholder="you@example.com" required/>
                </div>
                <div>
                    <label class="input-label">Password</label>
                    <input type="password" name="password" class="input-field" placeholder="Min. 6 characters" required/>
                </div>
                <div>
                    <label class="input-label">Phone Number</label>
                    <input type="text" name="phone" class="input-field" placeholder="+94 77 123 4567"/>
                </div>
                <div>
                    <label class="input-label">Delivery Address</label>
                    <textarea name="address" class="input-field" rows="2" placeholder="No 12, Galle Road, Colombo 03"></textarea>
                </div>
            </div>
            <button type="submit" class="btn-primary mt-6" style="width:100%; font-size:15px; padding:12px;">
                Create Account
            </button>
        </form>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:14px; color:#6b7280;">
        Already have an account?
        <a href="/login" style="color:#f97316; text-decoration:none; font-weight:500;">Sign in</a>
    </p>
</div>

</body>
</html>
