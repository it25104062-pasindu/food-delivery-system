<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Login')}"></head>
<body class="min-h-screen flex items-center justify-center" style="background:#0f0f0f;">

<div class="w-full max-w-md px-4 fade-in">
    <!-- Logo -->
    <div class="text-center mb-10">
        <h1 style="font-family:'Playfair Display',serif; font-size:36px; color:#f97316; font-weight:700;">BiteBridge</h1>
        <p style="color:#6b7280; font-size:14px; margin-top:4px;">Sign in to your account</p>
    </div>

    <!-- Error alert -->
    <div th:if="${error}" style="background:#2a0000; border:1px solid #7f1d1d; border-radius:8px; padding:12px 16px; color:#f87171; font-size:14px; margin-bottom:16px;">
        <span th:text="${error}"></span>
    </div>

    <div class="card p-8">
        <form action="/login" method="post">
            <p style="font-size:12px; color:#9ca3af; margin-bottom:14px; text-transform:uppercase; letter-spacing:.08em;">Customer / Admin Login</p>
            <div class="mb-5">
                <label class="input-label">Email address</label>
                <input type="email" name="email" class="input-field" placeholder="you@example.com" required/>
            </div>
            <div class="mb-6">
                <label class="input-label">Password</label>
                <input type="password" name="password" class="input-field" placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn-primary w-full text-center" style="width:100%; font-size:15px; padding:12px;">
                Sign In
            </button>
        </form>

        <div style="height:1px; background:#2e2e2e; margin:20px 0;"></div>

        <form action="/login/rider" method="post">
            <p style="font-size:12px; color:#9ca3af; margin-bottom:14px; text-transform:uppercase; letter-spacing:.08em;">Rider Quick Login (No Password)</p>
            <div class="mb-5">
                <label class="input-label">Rider Email</label>
                <input type="email" name="email" class="input-field" placeholder="rider@example.com" required/>
            </div>
            <button type="submit" class="btn-ghost w-full text-center" style="width:100%; font-size:15px; padding:12px;">
                Rider Login
            </button>
        </form>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:14px; color:#6b7280;">
        New customer?
        <a href="/register" style="color:#f97316; text-decoration:none; font-weight:500;">Create an account</a>
    </p>
</div>

</body>
</html>
