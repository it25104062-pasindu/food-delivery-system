<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Admin Dashboard')}"></head>
<body style="background:#0f0f0f;">
<div th:replace="~{layout/nav-admin :: nav}"></div>

<main class="max-w-7xl mx-auto px-4 py-10 fade-in">
    <h1 style="font-family:'Playfair Display',serif; font-size:32px; color:#f5f5f5; margin-bottom:8px;">Dashboard</h1>
    <p style="color:#6b7280; margin-bottom:32px;">System overview</p>

    <!-- Stats -->
    <div class="grid grid-cols-4 gap-4 mb-10">
        <div class="card p-5">
            <p style="font-size:12px; color:#6b7280; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;">Total Orders</p>
            <p style="font-size:32px; font-weight:700; color:#f97316;" th:text="${orders.size()}">0</p>
        </div>
        <div class="card p-5">
            <p style="font-size:12px; color:#6b7280; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;">Pending</p>
            <p style="font-size:32px; font-weight:700; color:#fb923c;" th:text="${orders.?[status == 'PENDING'].size()}">0</p>
        </div>
        <div class="card p-5">
            <p style="font-size:12px; color:#6b7280; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;">Delivered</p>
            <p style="font-size:32px; font-weight:700; color:#34d399;" th:text="${orders.?[status == 'DELIVERED'].size()}">0</p>
        </div>
        <div class="card p-5">
            <p style="font-size:12px; color:#6b7280; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;">Active Riders</p>
            <p style="font-size:32px; font-weight:700; color:#60a5fa;" th:text="${riders.?[available].size()}">0</p>
        </div>
    </div>

    <!-- Recent orders table -->
    <h2 style="font-size:17px; font-weight:600; color:#9ca3af; text-transform:uppercase; letter-spacing:.06em; margin-bottom:16px;">Recent Orders</h2>
    <div class="card overflow-hidden mb-8">
        <table>
            <thead>
            <tr><th>Customer</th><th>Amount</th><th>Status</th><th>Time</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td style="font-weight:500; color:#f5f5f5;" th:text="${order.customerName}">Name</td>
                <td style="color:#f97316; font-weight:600;" th:text="${'Rs. ' + #numbers.formatDecimal(order.totalAmount,1,2)}">0.00</td>
                <td><span class="badge" th:classappend="${'badge-' + order.status}" th:text="${order.status}">S</span></td>
                <td style="color:#6b7280; font-size:12px;" th:text="${#strings.abbreviate(order.createdAt,16)}">time</td>
                <td><a href="/admin/orders" class="btn-ghost" style="padding:4px 10px; font-size:12px;">Manage</a></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Quick nav -->
    <div class="grid grid-cols-3 gap-4">
        <a href="/admin/menu"   class="card p-5" style="text-decoration:none; transition:border-color .2s;" onmouseover="this.style.borderColor='#f97316'" onmouseout="this.style.borderColor='#2e2e2e'">
            <div style="font-size:28px; margin-bottom:10px;">🍔</div>
            <p style="font-weight:600; color:#f5f5f5;">Manage Menu</p>
        </a>
        <a href="/admin/orders" class="card p-5" style="text-decoration:none; transition:border-color .2s;" onmouseover="this.style.borderColor='#f97316'" onmouseout="this.style.borderColor='#2e2e2e'">
            <div style="font-size:28px; margin-bottom:10px;">📋</div>
            <p style="font-weight:600; color:#f5f5f5;">All Orders</p>
        </a>
        <a href="/admin/riders" class="card p-5" style="text-decoration:none; transition:border-color .2s;" onmouseover="this.style.borderColor='#f97316'" onmouseout="this.style.borderColor='#2e2e2e'">
            <div style="font-size:28px; margin-bottom:10px;">🛵</div>
            <p style="font-weight:600; color:#f5f5f5;">Manage Riders</p>
        </a>
    </div>
</main>
</body>
</html>
