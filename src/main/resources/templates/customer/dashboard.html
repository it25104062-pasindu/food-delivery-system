<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Dashboard')}"></head>
<body style="background:#0f0f0f;">
<div th:replace="~{layout/nav-customer :: nav}"></div>

<main class="max-w-7xl mx-auto px-4 py-10 fade-in">

    <!-- Hero greeting -->
    <div style="background:linear-gradient(135deg,#1a1000,#1a0a00); border:1px solid #3a2000; border-radius:16px; padding:40px; margin-bottom:32px; position:relative; overflow:hidden;">
        <div style="position:absolute; right:40px; top:50%; transform:translateY(-50%); font-size:80px; opacity:.12;">🍔</div>
        <p style="color:#fb923c; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px;">Welcome back</p>
        <h1 style="font-family:'Playfair Display',serif; font-size:34px; color:#f5f5f5; margin-bottom:8px;" th:text="${'Hey, ' + session.userName + '!'}">Hey there!</h1>
        <p style="color:#9ca3af; font-size:15px;">What are you craving today?</p>
        <a href="/customer/menu" class="btn-primary" style="display:inline-block; margin-top:20px;">Browse Menu →</a>
    </div>

    <!-- Quick stats row -->
    <div class="grid grid-cols-3 gap-4 mb-8">
        <div class="card p-5 text-center">
            <p style="font-size:28px; font-weight:700; color:#f97316;" th:text="${cart != null ? cart.totalItems : 0}">0</p>
            <p style="font-size:13px; color:#6b7280; margin-top:4px;">Items in Cart</p>
        </div>
        <div class="card p-5 text-center">
            <p style="font-size:28px; font-weight:700; color:#34d399;" th:text="${cart != null ? 'Rs. ' + #numbers.formatDecimal(cart.total,1,2) : 'Rs. 0.00'}">Rs. 0.00</p>
            <p style="font-size:13px; color:#6b7280; margin-top:4px;">Cart Total</p>
        </div>
        <div class="card p-5 text-center">
            <a href="/customer/cart" class="btn-primary" style="width:100%; display:block; text-align:center; padding:10px;">Go to Cart →</a>
        </div>
    </div>

    <!-- Quick links -->
    <h3 style="font-size:16px; font-weight:600; color:#9ca3af; margin-bottom:16px; text-transform:uppercase; letter-spacing:.06em;">Quick Actions</h3>
    <div class="grid grid-cols-2 gap-4">
        <a href="/customer/menu" class="card p-6" style="text-decoration:none; transition:border-color .2s;" onmouseover="this.style.borderColor='#f97316'" onmouseout="this.style.borderColor='#2e2e2e'">
            <div style="font-size:32px; margin-bottom:12px;">🍕</div>
            <h3 style="font-size:16px; font-weight:600; color:#f5f5f5; margin-bottom:4px;">Order Food</h3>
            <p style="font-size:13px; color:#6b7280;">Browse our full menu</p>
        </a>
        <a href="/customer/orders/history" class="card p-6" style="text-decoration:none; transition:border-color .2s;" onmouseover="this.style.borderColor='#f97316'" onmouseout="this.style.borderColor='#2e2e2e'">
            <div style="font-size:32px; margin-bottom:12px;">📦</div>
            <h3 style="font-size:16px; font-weight:600; color:#f5f5f5; margin-bottom:4px;">My Orders</h3>
            <p style="font-size:13px; color:#6b7280;">Track & view history</p>
        </a>
    </div>
</main>
</body>
</html>
