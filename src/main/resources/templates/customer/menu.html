<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Menu')}"></head>
<body style="background:#0f0f0f;">
<div th:replace="~{layout/nav-customer :: nav}"></div>

<main class="max-w-7xl mx-auto px-4 py-10 fade-in">

    <div class="flex items-center justify-between mb-8">
        <h1 style="font-family:'Playfair Display',serif; font-size:32px; color:#f5f5f5;">Our Menu</h1>
        <!-- Category filter -->
        <div class="flex gap-2 flex-wrap">
            <a href="/customer/menu" class="btn-ghost" style="padding:6px 14px; font-size:13px;">All</a>
            <a href="/customer/menu?category=Burgers"  class="btn-ghost" style="padding:6px 14px; font-size:13px;">Burgers</a>
            <a href="/customer/menu?category=Pizza"    class="btn-ghost" style="padding:6px 14px; font-size:13px;">Pizza</a>
            <a href="/customer/menu?category=Rice"     class="btn-ghost" style="padding:6px 14px; font-size:13px;">Rice</a>
            <a href="/customer/menu?category=Drinks"   class="btn-ghost" style="padding:6px 14px; font-size:13px;">Drinks</a>
            <a href="/customer/menu?category=Desserts" class="btn-ghost" style="padding:6px 14px; font-size:13px;">Desserts</a>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(items)}" class="text-center py-20">
        <p style="font-size:48px; margin-bottom:12px;">🍽</p>
        <p style="color:#6b7280;">No items available right now.</p>
    </div>

    <!-- Menu grid -->
    <div class="grid grid-cols-1 gap-5" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
        <div th:each="item : ${items}" class="card overflow-hidden" style="transition:transform .2s, border-color .2s;"
             onmouseover="this.style.transform='translateY(-3px)'; this.style.borderColor='#3a3a3a'"
             onmouseout="this.style.transform='none'; this.style.borderColor='#2e2e2e'">

            <img th:src="${item.imageUrl}"
                 th:alt="${item.name}"
                 style="width:100%; height:180px; object-fit:cover; border-bottom:1px solid #2e2e2e;"
                 onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1495195134817-aeb325a55b65?auto=format&fit=crop&w=1200&q=80';"/>

            <!-- Category chip -->
            <div style="background:#242424; padding:12px 16px; border-bottom:1px solid #2e2e2e; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; font-weight:600; color:#f97316; text-transform:uppercase; letter-spacing:.06em;" th:text="${item.category}">Category</span>
                <span th:if="${item.available}" style="font-size:11px; color:#34d399; font-weight:500;">● Available</span>
            </div>

            <div class="p-5">
                <h3 style="font-size:17px; font-weight:600; color:#f5f5f5; margin-bottom:6px;" th:text="${item.name}">Item Name</h3>
                <p style="font-size:13px; color:#9ca3af; margin-bottom:16px; line-height:1.5;" th:text="${item.description}">Description</p>
                <div class="flex items-center justify-between">
                    <span style="font-size:20px; font-weight:700; color:#f97316;" th:text="${'Rs. ' + #numbers.formatDecimal(item.price,1,2)}">Rs. 0.00</span>
                    <form action="/customer/cart/add" method="post" style="display:flex; gap:6px; align-items:center;">
                        <input type="hidden" name="menuItemId" th:value="${item.id}"/>
                        <input type="number" name="quantity" value="1" min="1" max="10"
                               style="background:#242424; border:1px solid #3a3a3a; color:#e5e5e5; border-radius:6px; padding:5px 8px; width:52px; text-align:center;"/>
                        <button type="submit" class="btn-primary" style="padding:7px 14px; font-size:13px;">Add</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
